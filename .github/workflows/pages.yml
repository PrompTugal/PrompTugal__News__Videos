name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  # read the github-pages deployments: the anchor of the security checks (security@'s fourth ruling)
  deployments: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every commit since the last release carries an Agent trailer
        # Anchored on the last successful github-pages deployment, not on a tag or github.event.before: GitHub drops a pending
        # run when a newer one queues, so the commits of a dropped push are covered by the range anchor..AFTER (specialist.code@
        # finding 3b; security@'s fourth ruling).
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The anchor A (security@'s fourth ruling, 19 Nov 2026): the newest commit a passing run verified, read from CI's own
          # record: the newest github-pages deployment that ever succeeded, with this run's read token. A pusher who edits this
          # workflow, or holds a write token, could still make such a record: only branch protection and a dev-only rule on the
          # github-pages environment close that (Dinis's to set).
          # Tags are not used. A must be in this clone and an ancestor of AFTER; the range checked is A..AFTER, so commits of
          # dropped pushes are covered, and every check runs from A's copy. No A, or no copy there: the run fails.
          base_of() {
            local api="https://api.github.com/repos/$GITHUB_REPOSITORY" h1="Authorization: Bearer $GH_TOKEN" h2="Accept: application/vnd.github+json" list row id sha state
            list=$(curl -fsS -H "$h1" -H "$h2" "$api/deployments?environment=github-pages&per_page=50") || { echo "cannot read the deployments: refusing" >&2; return 1; }
            for row in $(printf '%s' "$list" | jq -r '.[] | "\(.id):\(.sha)"'); do
              id=${row%%:*}; sha=${row#*:}
              # any success: deploy-pages marks an older deployment inactive after a newer one succeeds, and that commit stayed verified
              state=$(curl -fsS -H "$h1" -H "$h2" "$api/deployments/$id/statuses?per_page=100" | jq -r 'if any(.[]; .state == "success") then "success" else "" end') || state=""
              if [ "$state" = "success" ]; then
                [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "a deployment sha that is not a commit id: refusing" >&2; return 1; }
                GIT_NO_REPLACE_OBJECTS=1 git cat-file -e "$sha^{commit}" 2>/dev/null || { echo "the anchor $sha is not in this clone: refusing" >&2; return 1; }
                GIT_NO_REPLACE_OBJECTS=1 git merge-base --is-ancestor "$sha" "$AFTER" || { echo "the anchor is not an ancestor of AFTER (a force push): refusing" >&2; return 1; }
                echo "$sha"; return 0
              fi
            done
            echo "no successful github-pages deployment to anchor on: refusing" >&2; return 1
          }
          # Every security check runs from the trusted base's copy, never from the commits it checks (security@'s control 7,
          # widened); the trailer and signature checks run before any pushed code, the leak scan after the build it scans;
          # each is written into scripts/ under an ignored name (any link there removed first);
          # a base without one is refused (fails closed).
          trusted() { local name=$1 rc=0; shift; rm -f "scripts/trusted-$name"; GIT_NO_REPLACE_OBJECTS=1 git show "$base:scripts/$name" > "scripts/trusted-$name" 2>/dev/null || { rm -f "scripts/trusted-$name"; echo "the trusted base has no scripts/$name: refusing" >&2; exit 1; }; NODE_OPTIONS= node "scripts/trusted-$name" "$@" || rc=$?; rm -f "scripts/trusted-$name"; [ "$rc" = 0 ] || exit "$rc"; }
          base=$(base_of)
          # The trailer check reads scripts/commit-exemptions.json from the tree: a push may not add or change it.
          GIT_NO_REPLACE_OBJECTS=1 git diff --quiet "$base" "$AFTER" -- scripts/commit-exemptions.json || { echo "scripts/commit-exemptions.json changed in this push: refusing" >&2; exit 1; }
          trusted check-commits.mjs "$base" "$AFTER"
          # Signed commits (Dinis, 19 Nov 2026): every commit in the range is signed by its Agent:'s published key; nothing
          # is exempt: this workflow makes no commits.
          trusted check-signatures.mjs "$base" "$AFTER"
          # Only then the pushed copy's own tests.
          node scripts/test-check-signatures.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Leak scan (tracked files and the built site) from the trusted base's copy, then the pushed copy's own tests
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The anchor A (security@'s fourth ruling, 19 Nov 2026): the newest commit a passing run verified, read from CI's own
          # record: the newest github-pages deployment that ever succeeded, with this run's read token. A pusher who edits this
          # workflow, or holds a write token, could still make such a record: only branch protection and a dev-only rule on the
          # github-pages environment close that (Dinis's to set).
          # Tags are not used. A must be in this clone and an ancestor of AFTER; the range checked is A..AFTER, so commits of
          # dropped pushes are covered, and every check runs from A's copy. No A, or no copy there: the run fails.
          base_of() {
            local api="https://api.github.com/repos/$GITHUB_REPOSITORY" h1="Authorization: Bearer $GH_TOKEN" h2="Accept: application/vnd.github+json" list row id sha state
            list=$(curl -fsS -H "$h1" -H "$h2" "$api/deployments?environment=github-pages&per_page=50") || { echo "cannot read the deployments: refusing" >&2; return 1; }
            for row in $(printf '%s' "$list" | jq -r '.[] | "\(.id):\(.sha)"'); do
              id=${row%%:*}; sha=${row#*:}
              # any success: deploy-pages marks an older deployment inactive after a newer one succeeds, and that commit stayed verified
              state=$(curl -fsS -H "$h1" -H "$h2" "$api/deployments/$id/statuses?per_page=100" | jq -r 'if any(.[]; .state == "success") then "success" else "" end') || state=""
              if [ "$state" = "success" ]; then
                [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "a deployment sha that is not a commit id: refusing" >&2; return 1; }
                GIT_NO_REPLACE_OBJECTS=1 git cat-file -e "$sha^{commit}" 2>/dev/null || { echo "the anchor $sha is not in this clone: refusing" >&2; return 1; }
                GIT_NO_REPLACE_OBJECTS=1 git merge-base --is-ancestor "$sha" "$AFTER" || { echo "the anchor is not an ancestor of AFTER (a force push): refusing" >&2; return 1; }
                echo "$sha"; return 0
              fi
            done
            echo "no successful github-pages deployment to anchor on: refusing" >&2; return 1
          }
          # Every security check runs from the trusted base's copy, never from the commits it checks (security@'s control 7,
          # widened); the trailer and signature checks run before any pushed code, the leak scan after the build it scans;
          # each is written into scripts/ under an ignored name (any link there removed first);
          # a base without one is refused (fails closed).
          trusted() { local name=$1 rc=0; shift; rm -f "scripts/trusted-$name"; GIT_NO_REPLACE_OBJECTS=1 git show "$base:scripts/$name" > "scripts/trusted-$name" 2>/dev/null || { rm -f "scripts/trusted-$name"; echo "the trusted base has no scripts/$name: refusing" >&2; exit 1; }; NODE_OPTIONS= node "scripts/trusted-$name" "$@" || rc=$?; rm -f "scripts/trusted-$name"; [ "$rc" = 0 ] || exit "$rc"; }
          base=$(base_of)
          trusted leak-scan.mjs
          node scripts/test-leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
