name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every commit since the last release carries an Agent trailer
        # From BEFORE (github.event.before, the commit dev pointed to before this push) or the last release tag reachable
        # from it: GitHub drops a pending run when a newer one queues, so BEFORE may be the head of a push whose run never ran
        # (specialist.code@ finding 3b); the tag, an ancestor of BEFORE, was checked when it was released.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The checker and its range start come from BEFORE (the commit dev pointed to before this push), or from the last
          # release tag reachable from BEFORE: always an ancestor of BEFORE, and released, so checked even when GitHub dropped
          # the run of the push that made BEFORE. BEFORE must exist and be an ancestor of AFTER (security@'s control 7, third
          # ruling); a missing copy of a check there is refused.
          base_of() {
            if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then echo "no BEFORE (a new branch or a first push): refusing" >&2; return 1; fi
            GIT_NO_REPLACE_OBJECTS=1 git merge-base --is-ancestor "$BEFORE" "$AFTER" || { echo "BEFORE is not an ancestor of AFTER (a force push): refusing" >&2; return 1; }
            local last; last=$(GIT_NO_REPLACE_OBJECTS=1 git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$BEFORE" 2>/dev/null || true)
            echo "${last:-$BEFORE}"
          }
          # Every security check runs from the trusted base's copy, never from the commits it checks (security@'s control 7,
          # widened); the trailer and signature checks run before any pushed code, the leak scan after the build it scans;
          # each is written into scripts/ under an ignored name (any link there removed first);
          # a base without one is refused (fails closed).
          trusted() { local name=$1 rc=0; shift; rm -f "scripts/trusted-$name"; GIT_NO_REPLACE_OBJECTS=1 git show "$base:scripts/$name" > "scripts/trusted-$name" 2>/dev/null || { rm -f "scripts/trusted-$name"; echo "the trusted base has no scripts/$name: refusing" >&2; exit 1; }; NODE_OPTIONS= node "scripts/trusted-$name" "$@" || rc=$?; rm -f "scripts/trusted-$name"; [ "$rc" = 0 ] || exit "$rc"; }
          base=$(base_of)
          # The trailer check reads scripts/commit-exemptions.json from the tree: a push may not add or change it.
          GIT_NO_REPLACE_OBJECTS=1 git diff --quiet "$base" "$AFTER" -- scripts/commit-exemptions.json || { echo "scripts/commit-exemptions.json changed in this push: refusing" >&2; exit 1; }
          trusted check-commits.mjs "$base" "$AFTER"
          # Signed commits (Dinis, 19 Nov 2026): every commit in the range is signed by its Agent:'s published key; nothing
          # is exempt: this workflow makes no commits.
          trusted check-signatures.mjs "$base" "$AFTER"
          # Only then the pushed copy's own tests.
          node scripts/test-check-signatures.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Leak scan (tracked files and the built site) from the trusted base's copy, then the pushed copy's own tests
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The checker and its range start come from BEFORE (the commit dev pointed to before this push), or from the last
          # release tag reachable from BEFORE: always an ancestor of BEFORE, and released, so checked even when GitHub dropped
          # the run of the push that made BEFORE. BEFORE must exist and be an ancestor of AFTER (security@'s control 7, third
          # ruling); a missing copy of a check there is refused.
          base_of() {
            if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then echo "no BEFORE (a new branch or a first push): refusing" >&2; return 1; fi
            GIT_NO_REPLACE_OBJECTS=1 git merge-base --is-ancestor "$BEFORE" "$AFTER" || { echo "BEFORE is not an ancestor of AFTER (a force push): refusing" >&2; return 1; }
            local last; last=$(GIT_NO_REPLACE_OBJECTS=1 git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$BEFORE" 2>/dev/null || true)
            echo "${last:-$BEFORE}"
          }
          # Every security check runs from the trusted base's copy, never from the commits it checks (security@'s control 7,
          # widened); the trailer and signature checks run before any pushed code, the leak scan after the build it scans;
          # each is written into scripts/ under an ignored name (any link there removed first);
          # a base without one is refused (fails closed).
          trusted() { local name=$1 rc=0; shift; rm -f "scripts/trusted-$name"; GIT_NO_REPLACE_OBJECTS=1 git show "$base:scripts/$name" > "scripts/trusted-$name" 2>/dev/null || { rm -f "scripts/trusted-$name"; echo "the trusted base has no scripts/$name: refusing" >&2; exit 1; }; NODE_OPTIONS= node "scripts/trusted-$name" "$@" || rc=$?; rm -f "scripts/trusted-$name"; [ "$rc" = 0 ] || exit "$rc"; }
          base=$(base_of)
          trusted leak-scan.mjs
          node scripts/test-leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
